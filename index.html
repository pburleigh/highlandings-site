<style>
  :root{
    --forest: #345A3E;
    --brass: #C49E48;
    --charcoal: #454545;
    --cream: #F9F7ED;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--cream);
    font-family:'Poppins',sans-serif;
    overflow-x:hidden;
  }
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  /* subtle background mountain silhouette */
  .bg-motif{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
  }

  .content{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:6vh 6vw;
    opacity:0;
    transform:translateY(10px);
    animation:riseIn 1.1s ease-out forwards;
    animation-delay:.15s;
  }

  @keyframes riseIn{
    to{opacity:1; transform:translateY(0);}
  }

  .mark{
    width:min(220px, 34vw);
    height:auto;
    margin-bottom:clamp(18px, 3vh, 30px);
    filter:drop-shadow(0 6px 18px rgba(52,90,62,0.18));
  }

  .wordmark{
    font-family:'Lora', serif;
    font-weight:600;
    font-size:clamp(2.1rem, 6vw, 3.6rem);
    color:var(--charcoal);
    letter-spacing:0.01em;
    margin:0;
    line-height:1.1;
  }

  .rule{
    width:64px;
    height:2px;
    background:var(--brass);
    border:none;
    margin:clamp(16px, 2.6vh, 24px) 0;
  }

  .tagline{
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:clamp(0.72rem, 1.6vw, 0.95rem);
    letter-spacing:0.32em;
    color:var(--brass);
    text-transform:uppercase;
    margin:0;
  }

  footer{
    position:absolute;
    bottom:28px;
    left:0;
    right:0;
    text-align:center;
    z-index:1;
    font-family:'Poppins', sans-serif;
    font-size:0.72rem;
    letter-spacing:0.08em;
    color:var(--charcoal);
    opacity:0.45;
  }

  @media (max-width:480px){
    footer{bottom:18px; font-size:0.65rem;}
  }
</style>
</head>
